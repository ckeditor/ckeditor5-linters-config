packages:
  - packages/*

allowBuilds:
  'esbuild': true
  'unrs-resolver': true
  'snyk': true

overrides:
  'diff@^7': '^8.0.3'
  'serialize-javascript@^6': '^7.1.2'
  'esbuild@^0.27': '^0.28.1'
  'js-yaml@^3': '^4.3.1'
  'postcss-selector-parser@^6': '^7.1.6'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'
  - 'fast-uri' # Remove after 2026-10-22.

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
autoDedupe: true
linkWorkspacePackages: true
verifyDepsBeforeRun: false
