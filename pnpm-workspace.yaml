packages:
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  'esbuild': true
  'unrs-resolver': true
  'snyk': true

overrides:
  'diff@^7': '^8.0.3'
  'serialize-javascript@^6': '^7.1.3'
  'js-yaml@^3': '^4.3.1'
  'postcss-selector-parser@^6': '^7.1.6'
  'glob@^13': '^14.0.3'
  'minimatch@^10': '^11.0.3'

minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - '@ckeditor/*'
  - '@cksource/*'
  - '*ckeditor5*'

shellEmulator: true
shamefullyHoist: true
preferFrozenLockfile: true
autoDedupe: true
linkWorkspacePackages: true
verifyDepsBeforeRun: false
